[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-paper-trader"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["lumibot==4.6.46", "openai==2.54.0", "pydantic==2.14.2", "PyYAML==6.0.3", "python-dotenv==1.2.4", "portalocker==4.4.2", "Flask==3.1.3", "psutil==7.2.2"]

[project.scripts]
paper-bot = "trading_bot.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
