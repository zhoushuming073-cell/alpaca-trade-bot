enabled: true
version: oneshot-2026-11-07
allowed_session: regular
history_bars: 40
indicators: []
entry_checks: []
exit_checks: []
entry_rules: >-
  参考强势回撤、事件性错杀、趋势与风险收益关系。AI 可以自主选择股票池内的标的、
  方向、整数股数和限价，也可以 NO_TRADE。以上仅为研究建议，不是机械入场条件。
exit_rules: >-
  根据真实持仓、成本、浮盈亏、未完成订单和资金占用，自主决定持有、加仓、减仓或平仓。
  如平仓与剩余挂单冲突，可明确要求先撤销冲突挂单；取消结果及仓位必须由 Python 核实。
analysis_rules: >-
  基于有时间戳的行情、账户、新闻与研究证据形成独立判断。缺失或过期信息必须标为未知，
  可进一步研究或等待。已接受的 DAY 订单由券商继续管理；NO_TRADE 不取消既有挂单。
  股票池、资金、订单合法性、暂停、安全冻结、去重和美东交易时间是 Python 硬约束。
