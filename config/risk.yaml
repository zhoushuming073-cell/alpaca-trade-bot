# Non-positional protections retained from the previous system.
# The old single-symbol 10% and total-portfolio 50% caps are removed by the
# latest user specification.  Cash, no-margin, no-short, duplicate and
# reservation checks live in risk_manager.py and are mandatory.
max_daily_loss: 0.02
max_daily_orders: 10
max_bar_age_seconds: 120
max_quote_age_seconds: 30
max_spread: 0.01
max_price_deviation: 0.05
